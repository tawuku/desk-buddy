<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Pet preview</title>
<!-- Browser harness for the little man: the real renderer.js on a fake pet
     bridge (mood buttons instead of main.js), plus a gallery of poses. -->
<style>
  body { margin: 0; padding: 20px; background: #2f3440; color: #dfe6f0; font: 13px -apple-system, sans-serif; }
  .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  #stage { position: relative; width: 170px; height: 200px; background: repeating-conic-gradient(#4a4f5b 0% 25%, #3a3f4b 0% 50%) 50% / 16px 16px; border-radius: 8px; }
  #man { position: absolute; inset: 0; width: 170px; height: 200px; }
  #bubble { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); max-width: 150px; width: max-content; padding: 5px 9px;
    font: 600 11px/1.3 -apple-system, sans-serif; color: #2b2118; background: #fff; border: 1.5px solid #2b2118; border-radius: 11px; opacity: 0; transition: opacity .2s; }
  #bubble.show { opacity: 1; }
  button { margin: 2px; padding: 6px 10px; background: #454c5c; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  button.on { background: #3d7fd9; }
  .gallery { display: grid; grid-template-columns: repeat(6, 120px); gap: 10px; margin-top: 18px; }
  .cell { text-align: center; } .cell canvas { width: 120px; height: 141px; background: #3a3f4b; border-radius: 6px; }
</style>
</head>
<body>
  <div class="row">
    <div id="stage"><canvas id="man" width="340" height="400"></canvas><div id="bubble"></div></div>
    <div id="moods"></div>
  </div>
  <div class="gallery" id="gallery"></div>
  <script>
    let moodCb = () => {};
    window.pet = { onMood: (cb) => { moodCb = cb; }, moveWindowBy: () => {}, getBounds: async () => null };
    ['idle', 'coding', 'browsing', 'listening', 'vibing', 'asleep', 'running'].forEach((m) => {
      const b = document.createElement('button');
      b.textContent = m;
      b.onclick = () => { moodCb(m); document.querySelectorAll('#moods button').forEach((x) => x.classList.toggle('on', x === b)); };
      document.getElementById('moods').appendChild(b);
    });
  </script>
  <script>
    // Load fresh copies every time (the preview server lets the browser cache).
    const load = (src) => new Promise((ok) => { const el = document.createElement('script'); el.src = `${src}?t=${Date.now()}`; el.onload = ok; document.body.appendChild(el); });
    load('sprite.js').then(() => load('renderer.js')).then(gallery);
    function gallery() {
    const POSES = {
      neutral: {}, happy: { eyes: 'happy', mouth: 'grin' }, laugh: { eyes: 'happy', mouth: 'laugh', blush: 1 },
      surprised: { eyes: 'wide', brows: 'up', mouth: 'open', fx: { exclaim: 1 } }, angry: { brows: 'angry', mouth: 'flat' },
      sad: { brows: 'sad', mouth: 'frown', fx: { sweat: 1 } }, wave: { armF: { s: 2.7, e: -0.3 }, eyes: 'happy', mouth: 'grin' },
      think: { armF: { s: 2.05, e: 2.35 }, brows: 'raised', mouth: 'flat', fx: { question: 1 } },
      idea: { armF: { s: 2.2, e: -0.7 }, eyes: 'happy', mouth: 'grin', fx: { bulb: 1 } },
      coding: { legF: { h: 1.45, k: 0.05 }, legB: { h: 1.35, k: 0.15 }, props: { laptop: true }, armF: { s: 1.25, e: 0.35 }, armB: { s: 1.2, e: 0.35 }, mouth: 'tongue', pupil: { x: 0.7, y: 0.6 } },
      phone: { props: { phone: true }, armF: { s: 1.05, e: 1.55 }, pupil: { x: 0.4, y: 1 }, headTilt: 0.18 },
      coffee: { props: { mug: true }, armF: { s: 1.9, e: 2.2 }, eyes: 'closed', mouth: 'o', fx: { steam: 1 } },
      call: { props: { headset: true }, mouth: 'talk', armF: { s: 1.2, e: 1.2 } },
      music: { props: { headphones: true }, eyes: 'happy', armF: { s: 2.3, e: -0.2 }, armB: { s: -2.3, e: 0.2 }, fx: { notes: 0.3 } },
      sleep: { legF: { h: 1.45, k: 0.05 }, legB: { h: 1.35, k: 0.15 }, lean: 0.25, headTilt: 0.4, eyes: 'closed', mouth: 'o', fx: { zzz: 0.5, snot: 1 } },
      dizzy: { eyes: 'dizzy', mouth: 'frown', fx: { stars: 0.4 } }, fallen: { tilt: 1.1, x: -8, eyes: 'dizzy', fx: { stars: 1 } },
      run: { legF: { h: 0.8, k: -1.2 }, legB: { h: -0.8, k: -0.2 }, armF: { s: -0.8, e: 1.5 }, armB: { s: 0.8, e: 1.5 }, lean: 0.25, mouth: 'open', fx: { speed: 0.3 } },
    };
    // Every character from the front, side and back.
    for (const id of Object.keys(PET_CHARACTERS)) for (const view of ['front', 'side', 'back']) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const c = document.createElement('canvas'); c.width = 240; c.height = 282;
      drawMan(c.getContext('2d'), 240, 282, { character: id, view, eyes: view === 'front' ? 'happy' : 'open', mouth: 'grin' });
      cell.appendChild(c); cell.appendChild(document.createTextNode(`${id} · ${view}`));
      document.getElementById('gallery').appendChild(cell);
    }
    for (const [name, pose] of Object.entries(POSES)) {
      const cell = document.createElement('div'); cell.className = 'cell';
      const c = document.createElement('canvas'); c.width = 240; c.height = 282;
      drawMan(c.getContext('2d'), 240, 282, pose);
      cell.appendChild(c); cell.appendChild(document.createTextNode(name));
      document.getElementById('gallery').appendChild(cell);
    }
    }
  </script>
</body>
</html>
