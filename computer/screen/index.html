<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Screen</title>
<!--
  The JARVIS screen: a talking particle orb that briefs the day's findings
  across six categories. Implemented from the Claude Design "Jarvis Screen"
  project.

  Live, it's served by the JARVIS app at http://127.0.0.1:8094/
  (computer/voice/screen_server.py): real findings, Piper's voice, and the
  orb follows the actual audio level. The desktop pet shows it full-screen
  when you ask "hey Jarvis, give me my briefing" (or from its tray menu / PA).
  Opened as a plain file it runs on demo data with the browser's voice.

  URL options (the design's props):
    ?palette=blue|cyan|amber   orb colours          (default blue)
    ?density=1200..6000        orb particle count   (default 3200)
    ?voice=0                   start with voice off (default on)
    ?autostart=1               begin the briefing on load
    ?embedded=1                in the pet's window: DISMISS / Esc close it
    ?role=mirror               follow the lead screen (other displays): no
                               voice of its own, buttons act on the lead
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #03060b; overflow: hidden; }
  a { color: #7cc4ff; } a:hover { color: #c3a6ff; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .ease { transition: all 1.1s cubic-bezier(.7,0,.2,1); }

  #screen { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 55%, #07111f 0%, #03060b 70%);
    color: #cfe6ff; font-family: 'Chakra Petch', sans-serif; overflow: hidden; }

  #topbar { position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 22px 36px; font-size: 12px; letter-spacing: .18em; color: #6f9cc9; z-index: 3; }
  #topbar .left { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; transition: background .4s, box-shadow .4s; }
  #topbar .right { display: flex; align-items: center; gap: 28px; }

  #orb { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
  #orb canvas { width: 100%; height: 100%; display: block; }

  #caption-wrap { position: absolute; transform: translateX(-50%); text-align: center; z-index: 2; }
  #caption-label { font-size: 11px; letter-spacing: .3em; color: #5a86b3; margin-bottom: 12px; }
  #caption { font-size: clamp(14px, 1.5vw, 22px); line-height: 1.45; color: #e6f2ff; text-wrap: pretty;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }

  #panel { position: absolute; top: 84px; bottom: 110px; left: 36%; right: 36px; display: flex; flex-direction: column; gap: 18px; z-index: 2;
    transition: opacity .9s ease .3s, transform 1.1s cubic-bezier(.7,0,.2,1); }
  #panel-head { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid rgba(110,170,240,.22); padding-bottom: 12px; }
  #panel-head .kicker { font-size: 11px; letter-spacing: .3em; color: #5a86b3; }
  #panel-head .title { font-size: clamp(18px, 2.2vw, 30px); font-weight: 500; letter-spacing: .04em; color: #e6f2ff; margin-top: 4px; white-space: nowrap; }
  #progress { font-size: 11px; letter-spacing: .2em; color: #5a86b3; }
  #scroll { flex: 1; min-height: 0; overflow: auto; scrollbar-width: none; }
  #scroll::-webkit-scrollbar { display: none; }
  #cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }

  .card { position: relative; cursor: pointer; padding: 18px 20px; transition: all .6s ease; display: flex; flex-direction: column; gap: 12px; min-height: 180px; }
  .card .tick-h { position: absolute; top: -1px; left: -1px; width: 18px; height: 2px; }
  .card .tick-v { position: absolute; top: -1px; left: -1px; width: 2px; height: 18px; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; letter-spacing: .25em; }
  .card .count { color: #5a86b3; }
  .card .headline { font-size: 21px; font-weight: 500; line-height: 1.3; color: #e6f2ff; text-wrap: pretty; }
  .card .items { display: flex; flex-direction: column; gap: 7px; margin-top: auto; }
  .card .item { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: #9dbbd9; border-top: 1px solid rgba(110,170,240,.12); padding-top: 7px; }
  .card .item .r { font-size: 13px; white-space: nowrap; }

  #controls { position: absolute; bottom: 34px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; z-index: 3; }
  #controls button { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .25em; padding: 14px 22px; background: transparent;
    color: #7fa6cc; border: 1px solid rgba(120,180,255,.22); cursor: pointer; }
  #controls button:hover { color: #cfe6ff; }
  #controls button:disabled { opacity: .4; cursor: default; }

  /* ---- HUD effects: drifting grid, scan line, card reveals, results feed ---- */
  #screen::before { content: ''; position: absolute; inset: -48px 0 0 0; pointer-events: none;
    background-image: linear-gradient(rgba(80,140,220,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(80,140,220,.05) 1px, transparent 1px);
    background-size: 48px 48px; animation: grid-drift 12s linear infinite;
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 80%); }
  #screen::after { content: ''; position: absolute; left: 0; right: 0; top: -140px; height: 140px; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(120,190,255,.05) 85%, rgba(160,215,255,.12)); animation: scan 8s linear infinite; }
  @keyframes grid-drift { to { transform: translateY(48px); } }
  @keyframes scan { to { transform: translateY(calc(100vh + 140px)); } }
  #status-dot { animation: dot-pulse 1.6s ease-in-out infinite; }
  @keyframes dot-pulse { 50% { transform: scale(1.6); opacity: .6; } }

  .card.reveal { animation: card-in .75s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes card-in {
    0% { clip-path: inset(0 100% 0 0); filter: brightness(2.2); }
    55% { clip-path: inset(0 0 0 0); filter: brightness(1.5); box-shadow: 0 0 44px rgba(80,160,255,.45); }
    100% { clip-path: inset(0 0 0 0); filter: none; } }
  .card .sweep { position: absolute; left: 0; right: 0; top: 0; height: 2px; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent, #9fd4ff, transparent); }
  .card.reveal .sweep { animation: sweep 1.1s ease .15s both; }
  @keyframes sweep { 0% { top: 0; opacity: 1; } 100% { top: 100%; opacity: 0; } }
  .card.reveal .item { animation: row-in .45s ease both; }
  .card.reveal .item:nth-child(1) { animation-delay: .45s; }
  .card.reveal .item:nth-child(2) { animation-delay: .62s; }
  .card.reveal .item:nth-child(3) { animation-delay: .79s; }
  @keyframes row-in { from { opacity: 0; transform: translateX(-12px); } }
  .headline.typing::after { content: '▍'; color: #7cc4ff; animation: blink-c .6s steps(2) infinite; }
  @keyframes blink-c { 50% { opacity: 0; } }

  #feed { margin-top: 18px; text-align: left; font-size: 11px; line-height: 1.75; color: #4f7ea8; max-height: 8.8em; overflow: hidden;
    border-top: 1px solid rgba(110,170,240,.15); padding-top: 10px; transition: opacity .6s ease; }
  #feed:empty { opacity: 0; }
  #feed div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: row-in .3s ease both; }
  #feed b { color: #7cc4ff; font-weight: 500; }
  body.mini #feed, body.mini #screen::before, body.mini #screen::after { display: none; }

  /* Kill switch: minimize / close, top right (pet window only). */
  .winbtns { display: none; gap: 6px; margin-left: 10px; }
  .embedded .winbtns { display: flex; }
  .winbtns button { font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1; width: 30px; height: 26px;
    background: transparent; color: #7fa6cc; border: 1px solid rgba(120,180,255,.25); cursor: pointer; }
  .winbtns button:hover { color: #fff; border-color: rgba(160,210,255,.7); }
  .winbtns button.kill:hover { background: rgba(255,90,90,.25); border-color: #ff8a8a; }

  /* Minimized: a corner mini-player that keeps talking. */
  #mini-controls { display: none; position: absolute; top: 8px; right: 8px; z-index: 5; }
  body.mini #screen { border: 1px solid rgba(120,180,255,.35); border-radius: 14px; cursor: pointer;
    background: radial-gradient(ellipse at 20% 50%, #0b1a2e 0%, #03060b 80%); }
  body.mini #topbar, body.mini #panel, body.mini #controls { display: none !important; }
  body.mini #mini-controls { display: flex; }
  body.mini #orb { left: 56px !important; top: 58px !important; width: 104px !important; height: 104px !important; transition: none; }
  body.mini #caption-wrap { left: 112px !important; top: 16px !important; width: calc(100% - 196px) !important;
    transform: none !important; text-align: left; transition: none; }
  body.mini #caption-label { font-size: 9px; margin-bottom: 5px; }
  body.mini #caption { font-size: 13px; line-height: 1.35; }
  #controls #btn-primary { padding: 14px 28px; background: rgba(80,160,255,.12); color: #cfe6ff; border-color: rgba(120,180,255,.5); }
  #controls #btn-primary:hover { background: rgba(80,160,255,.25); }
</style>
</head>
<body>
<div id="screen">
  <div id="topbar" class="mono">
    <div class="left">
      <div id="status-dot"></div>
      <span style="color:#cfe6ff">J.A.R.V.I.S</span>
      <span>// <span id="status-label"></span></span>
    </div>
    <div class="right">
      <span id="date"></span>
      <span id="time" style="color:#cfe6ff"></span>
      <span class="winbtns">
        <button class="minimize" title="Minimize (⌘⇧M)">—</button>
        <button class="kill" title="Close (Esc · ⌘⇧⎋)">✕</button>
      </span>
    </div>
  </div>

  <div id="orb" class="ease"><canvas id="orb-canvas"></canvas></div>

  <div id="caption-wrap" class="ease">
    <div id="caption-label" class="mono"></div>
    <div id="caption"></div>
    <div id="feed" class="mono"></div>
  </div>

  <div id="panel">
    <div id="panel-head">
      <div>
        <div class="kicker mono">DAILY FINDINGS REPORT</div>
        <div class="title"><span id="cat-total">Six</span> categories · <span id="revealed-count">0</span> reported</div>
      </div>
      <div id="progress" class="mono"></div>
    </div>
    <div id="scroll"><div id="cards"></div></div>
  </div>

  <div id="mini-controls" class="winbtns">
    <button class="restore" title="Full screen (⌘⇧M)">⤢</button>
    <button class="kill" title="Close (⌘⇧⎋)">✕</button>
  </div>

  <div id="controls">
    <button id="btn-primary"></button>
    <button id="btn-voice"></button>
    <button id="btn-close">DISMISS</button>
  </div>
</div>

<script>
// ---- Content ---------------------------------------------------------------
// Live: served by JARVIS (computer/voice/screen_server.py) -- findings come
// from /findings, speech from Piper via /tts. Opened any other way (e.g. as a
// file), it runs on the design's demo findings with the browser's voice.
const LIVE = location.protocol === 'http:' && location.port === '8094';
const DEMO = {
  intro: "Good evening, sir. I've compiled today's findings across six categories.",
  outro: "That's everything. Shall I draft replies to the three priority messages?",
  categories: [
    { code:'01', name:'PRIORITY', count:'3 FLAGS', headline:'Contract renewal with Halden Co. expires Friday.',
      items:[{l:'Signature pending',r:'2 DAYS',tone:'warn'},{l:'Invoice #4471 overdue',r:'$12,400',tone:'bad'},{l:'Passport renewal window',r:'OPEN',tone:'good'}],
      say:'Priority first. Your contract renewal with Halden expires Friday, and one invoice is now overdue.' },
    { code:'02', name:'MARKETS', count:'5 TICKERS', headline:'Portfolio up 1.4% today, led by energy.',
      items:[{l:'Portfolio',r:'+$2,340',tone:'good'},{l:'S&P 500',r:'+0.8%',tone:'good'},{l:'BTC',r:'−1.2%',tone:'bad'}],
      say:'Markets. Your portfolio is up one point four percent, led by energy. Bitcoin is slightly down.' },
    { code:'03', name:'SCHEDULE', count:'4 EVENTS', headline:'Board call at 10:00. Two conflicts resolved.',
      items:[{l:'Board sync',r:'10:00',tone:'info'},{l:'Lunch — M. Ortiz',r:'13:00',tone:'info'},{l:'Gym block moved',r:'18:30',tone:'warn'}],
      say:'Your schedule. Board call at ten. I moved your gym block to six thirty to clear a conflict.' },
    { code:'04', name:'INBOX', count:'41 NEW', headline:'3 messages need your reply; 38 archived.',
      items:[{l:'Legal — NDA redlines',r:'URGENT',tone:'bad'},{l:'Sarah — Q4 roadmap',r:'TODAY',tone:'warn'},{l:'Newsletters filtered',r:'38',tone:'muted'}],
      say:'Inbox. Forty one new messages. Three need a reply from you, the rest I have archived.' },
    { code:'05', name:'WORLD', count:'6 STORIES', headline:'Chip export rules tightened; suppliers affected.',
      items:[{l:'Trade policy update',r:'HIGH',tone:'warn'},{l:'Rate decision Thursday',r:'WATCH',tone:'info'},{l:'Local: transit strike ends',r:'INFO',tone:'muted'}],
      say:'In the world, new chip export rules may affect two of your suppliers. Rate decision is Thursday.' },
    { code:'06', name:'SYSTEMS', count:'ALL NOMINAL', headline:'Home secure. Vehicle charged. Rain at 16:00.',
      items:[{l:'Doors & perimeter',r:'LOCKED',tone:'good'},{l:'Vehicle charge',r:'86%',tone:'good'},{l:'Weather',r:'18° · RAIN 4PM',tone:'info'}],
      say:'Finally, systems. The house is secure, the car is at eighty six percent, and expect rain at four.' }
  ]
};
const TONE = { good:'#8fe3b0', warn:'#ffb86b', bad:'#ff8a8a', info:'#cfe6ff', muted:'#5a86b3' };
const NUMBER_WORDS = ['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
const IDLE_CAPTION = 'Standing by. Say the word and I will brief you.';
const AUTO_CLOSE_MS = 2 * 60 * 1000; // embedded: close this long after the briefing ends, if untouched
const PALETTES = {
  blue:  [[70,170,255],[200,120,255]],
  cyan:  [[90,230,255],[60,255,190]],
  amber: [[255,190,90],[255,110,150]]
};

// ---- Options ---------------------------------------------------------------
const params = new URLSearchParams(location.search);
const opts = {
  palette: PALETTES[params.get('palette')] || PALETTES.blue,
  density: Math.min(6000, Math.max(1200, Number(params.get('density')) || 3200)),
  voice: params.get('voice') !== '0',
  autoStart: params.get('autostart') === '1',
  embedded: params.get('embedded') === '1', // shown in the pet app's window: DISMISS / Esc close it
  mirror: LIVE && params.get('role') === 'mirror' // another display: shows what the lead screen does
};

// ---- State -----------------------------------------------------------------
let report = LIVE ? null : DEMO;
let CATS = report ? report.categories : [];
const state = { phase: LIVE ? 'loading' : 'idle', step:-2, revealed:0, voice:opts.voice,
  caption: LIVE ? "Gathering today's findings…" : IDLE_CAPTION };
let speaking = false, talkSpeaking = false, level = 0, timer = null, runId = 0, autoCloseTimer = null;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

function set(patch) {
  Object.assign(state, patch);
  render();
  reportStatus();
}

// ---- JARVIS link -----------------------------------------------------------
// The lead screen reports its whole state; JARVIS relays it to the mirrors
// on other displays and uses the phase to know when the briefing is over.
// Only the pet's lead window reports: a copy opened in a browser tab mustn't
// fight it (it still works on its own, just without steering JARVIS).
function reportStatus() {
  if (!LIVE || opts.mirror || !opts.embedded) return;
  const { phase, step, revealed, caption, label, voice } = state;
  fetch('/screen/status', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ phase, step, revealed, caption, label, voice, speaking, report: report && report.generated_at }) }).catch(() => {});
}

// Buttons on a mirror act on the lead screen.
function command(cmd) {
  fetch('/screen/command', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ command: cmd }) }).catch(() => {});
}

let lastSeq = null;
async function poll() {
  try {
    const { seq, command: cmd, state: lead, talk } = await (await fetch('/screen/poll')).json();
    showTalk(talk);
    if (opts.mirror) {
      await follow(lead);
    } else if (lastSeq !== null && seq > lastSeq) {
      if (cmd === 'stop') stopBriefing();
      else if (cmd === 'start') start();
      else if (cmd === 'dismiss') opts.embedded ? closeWindow() : close();
      else if (cmd === 'voice') toggleVoice();
      else if (cmd && cmd.startsWith('replay:')) { const i = Number(cmd.slice(7)); if (i < state.revealed) replayCat(i); }
    }
    lastSeq = seq;
  } catch { /* JARVIS restarting -- keep trying */ }
  setTimeout(poll, opts.mirror ? 150 : 400);
}

// After the briefing the conversation carries on by voice; its stages (from
// JARVIS's HUD pushes) show in the caption.
const TALK_LABEL = { listening:'LISTENING', heard:'YOU', thinking:'JARVIS · THINKING', speaking:'JARVIS',
  reply:'JARVIS', error:'JARVIS · ERROR', empty:'LISTENING', sleep:'STANDING BY' };
let lastTalk = null;
function showTalk(talk) {
  if (!talk) return;
  const fresh = lastTalk !== null && talk.seq > lastTalk;
  lastTalk = talk.seq;
  if (!fresh || !TALK_LABEL[talk.stage] || state.phase === 'briefing' || state.phase === 'loading') return;
  talkSpeaking = talk.stage === 'speaking';
  clearTimeout(autoCloseTimer); // still talking -- don't auto-close mid-conversation
  if (opts.embedded && !opts.mirror && state.phase === 'done' && talk.stage === 'sleep') autoCloseTimer = setTimeout(closeWindow, 15000);
  const caption = talk.stage === 'listening' ? 'Go ahead, I\'m listening.' : talk.stage === 'sleep' ? IDLE_CAPTION
    : talk.stage === 'thinking' ? (talk.text ? `“${talk.text}”` : 'Thinking…') : talk.text || state.caption;
  set({ label: TALK_LABEL[talk.stage], caption });
}

let leadSeenOpen = false; // ignore a stale "closed" left over from an earlier session
async function follow(lead) {
  if (!lead) return;
  if (['loading', 'idle', 'briefing', 'done'].includes(lead.phase)) leadSeenOpen = true;
  if (lead.phase === 'closed' && leadSeenOpen && opts.embedded) { window.close(); return; }
  if (lead.report && (!report || report.generated_at !== lead.report)) { report = null; await loadReport(); }
  speaking = !!lead.speaking;
  const phase = ['briefing', 'done', 'idle'].includes(lead.phase) ? lead.phase : state.phase === 'loading' ? 'loading' : 'idle';
  Object.assign(state, { phase, step: lead.step ?? -2, revealed: lead.revealed ?? 0,
    caption: lead.caption || state.caption, label: lead.label || null, voice: lead.voice ?? state.voice });
  render();
}

async function loadReport() {
  for (let attempt = 0; attempt < 3 && !report; attempt++) {
    try {
      const res = await fetch('/findings');
      if (res.ok) report = await res.json();
    } catch { /* retry */ }
  }
  if (!report) {
    set({ phase:'idle', caption:"I couldn't gather today's findings. Is JARVIS running?" });
    return false;
  }
  CATS = report.categories;
  buildCards();
  set({ phase:'idle', caption:IDLE_CAPTION });
  return true;
}

// ---- Cards -----------------------------------------------------------------
let cardEls = [];
function buildCards() {
  $('cards').innerHTML = '';
  cardEls = CATS.map((c, i) => {
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `
      <div class="tick-h"></div><div class="tick-v"></div><div class="sweep"></div>
      <div class="meta mono"><span class="name"></span><span class="count"></span></div>
      <div class="headline"></div>
      <div class="items"></div>`;
    el.querySelector('.name').textContent = `${c.code} · ${c.name}`;
    el.querySelector('.count').textContent = c.count;
    el.querySelector('.headline').textContent = c.headline;
    const items = el.querySelector('.items');
    for (const it of c.items) {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = '<span class="l"></span><span class="r mono"></span>';
      row.querySelector('.l').textContent = it.l;
      row.querySelector('.r').textContent = it.r;
      row.querySelector('.r').style.color = TONE[it.tone] || TONE.info;
      items.appendChild(row);
    }
    el.addEventListener('click', () => { if (i < state.revealed) opts.mirror ? command(`replay:${i}`) : replayCat(i); });
    $('cards').appendChild(el);
    return el;
  });
}

// ---- Render ----------------------------------------------------------------
function render() {
  const { phase, step, revealed, voice, caption } = state;
  const open = phase === 'briefing' || phase === 'done';

  const statusColor = phase === 'briefing' ? '#7cc4ff' : open ? '#c3a6ff' : '#3f6b96';
  $('status-dot').style.background = statusColor;
  $('status-dot').style.boxShadow = `0 0 10px ${statusColor}`;
  $('status-label').textContent = (phase === 'briefing' ? 'REPORTING' : open ? 'REPORT READY' : phase === 'loading' ? 'GATHERING' : 'LISTENING')
    + (LIVE ? '' : ' · DEMO');

  const orb = $('orb').style;
  orb.left = open ? '18%' : '50%';
  orb.top = open ? '44%' : '46%';
  orb.width = orb.height = open ? 'min(52vh,32vw)' : 'min(78vh,78vw)';

  const cap = $('caption-wrap').style;
  cap.left = open ? '18%' : '50%';
  cap.top = open ? 'calc(44% + min(23vh,14vw))' : 'calc(46% + min(30vh,26vw))';
  cap.width = open ? '28vw' : 'min(760px,80vw)';
  $('caption-label').textContent = state.label || (step >= 0 && step < CATS.length ? `REPORTING · ${CATS[step].name}` : 'JARVIS');
  $('caption').textContent = caption;

  const panel = $('panel').style;
  panel.opacity = open ? 1 : 0;
  panel.transform = `translateX(${open ? '0' : '60px'})`;
  panel.pointerEvents = open ? 'auto' : 'none';
  $('cat-total').textContent = NUMBER_WORDS[CATS.length] || CATS.length;
  $('revealed-count').textContent = revealed;
  $('progress').textContent = `${pad(revealed)} / ${pad(CATS.length)}`;

  cardEls.forEach((el, i) => {
    const shown = i < revealed, active = i === step;
    if (shown && !el.dataset.revealed) revealCard(el, CATS[i], open);
    if (!shown && el.dataset.revealed) resetCard(el, CATS[i]);
    const accent = active ? '#9fd4ff' : '#4f86c0';
    el.style.background = active ? 'rgba(40,110,200,.16)' : 'rgba(12,28,50,.45)';
    el.style.border = `1px solid ${active ? 'rgba(140,200,255,.7)' : 'rgba(110,170,240,.18)'}`;
    el.style.boxShadow = active ? '0 0 30px rgba(80,160,255,.25), inset 0 0 24px rgba(80,160,255,.08)' : 'none';
    el.style.opacity = shown ? 1 : 0.12;
    el.style.transform = shown ? 'none' : 'translateY(10px)';
    el.querySelector('.tick-h').style.background = accent;
    el.querySelector('.tick-v').style.background = accent;
    el.querySelector('.name').style.color = accent;
  });

  $('btn-primary').textContent = phase === 'briefing' ? 'RESTART BRIEFING' : phase === 'done' ? 'BRIEF AGAIN' : 'BRIEF ME';
  $('btn-primary').disabled = phase === 'loading' || !report;
  $('btn-voice').textContent = `VOICE ${voice ? 'ON' : 'OFF'}`;
  $('btn-close').style.display = open || opts.embedded ? '' : 'none';
}

// ---- Card reveal: wipe in, type the headline, decode the values, list them in the feed
const SCRAMBLE = '▓▒░<>/\\|=+*#%01';
function revealCard(el, c, animate) {
  el.dataset.revealed = '1';
  if (!animate) return;
  el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');
  const head = el.querySelector('.headline');
  let n = 0;
  head.textContent = ''; head.classList.add('typing');
  clearInterval(el._type);
  el._type = setInterval(() => {
    head.textContent = c.headline.slice(0, n += 2);
    if (n >= c.headline.length) { clearInterval(el._type); head.textContent = c.headline; head.classList.remove('typing'); }
  }, 22);
  el.querySelectorAll('.item .r').forEach((r, i) => {
    const final = c.items[i].r, start = performance.now() + 450 + i * 170;
    const tick = () => {
      const k = (performance.now() - start) / 520;
      if (k >= 1) { r.textContent = final; return; }
      r.textContent = k < 0 ? '' : final.split('').map((ch, j) => (j / final.length < k || ch === ' ' ? ch : SCRAMBLE[Math.random() * SCRAMBLE.length | 0])).join('');
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
  c.items.forEach((it, i) => setTimeout(() => feed(`<b>${c.code}</b> ${esc(c.name)} · ${esc(it.l)} — ${esc(it.r)}`), 500 + i * 220));
}

function resetCard(el, c) {
  delete el.dataset.revealed;
  clearInterval(el._type);
  el.classList.remove('reveal');
  el.querySelector('.headline').textContent = c.headline;
  el.querySelector('.headline').classList.remove('typing');
  el.querySelectorAll('.item .r').forEach((r, i) => { r.textContent = c.items[i].r; });
  $('feed').innerHTML = '';
}

function esc(t) { const d = document.createElement('div'); d.textContent = String(t); return d.innerHTML; }
function feed(html) {
  const line = document.createElement('div');
  line.innerHTML = '&gt; ' + html;
  $('feed').appendChild(line);
  while ($('feed').children.length > 5) $('feed').firstChild.remove();
}

function renderClock() {
  const now = new Date();
  $('time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  $('date').textContent = now.toLocaleDateString('en-GB', { weekday:'short', day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
}

// ---- Orb -------------------------------------------------------------------
// Fibonacci-sphere points, displaced by layered sine noise that swells with
// the speaking level -- the real Piper audio level when there is one.
function buildPoints(n) {
  const pts = [], g = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = g * i;
    pts.push([Math.cos(th) * r, y, Math.sin(th) * r]);
  }
  return pts;
}
const pts = buildPoints(opts.density);
const cv = $('orb-canvas'), ctx = cv.getContext('2d');
let audioCtx = null, analyser = null, currentSource = null;
const wave = new Uint8Array(1024);

function audioLevel() {
  if (!analyser || !currentSource) return null;
  analyser.getByteTimeDomainData(wave);
  let sum = 0;
  for (let i = 0; i < wave.length; i++) { const v = (wave[i] - 128) / 128; sum += v * v; }
  return Math.min(1, Math.sqrt(sum / wave.length) * 4.5);
}

function draw(t) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);

  const real = speaking ? audioLevel() : null;
  const target = !(speaking || talkSpeaking) ? 0.08 : real !== null ? 0.2 + 0.8 * real
    : 0.35 + 0.65 * Math.abs(Math.sin(t * 8.3)) * Math.abs(Math.sin(t * 3.1 + 1));
  level += (target - level) * (speaking || talkSpeaking ? 0.25 : 0.05);
  const L = level, R = Math.min(w, h) * 0.32, cx = w / 2, cy = h / 2;
  const [c1, c2] = opts.palette;
  const ry = t * 0.18, cyr = Math.cos(ry), syr = Math.sin(ry);
  const rx = 0.35 + Math.sin(t * 0.2) * 0.15, cxr = Math.cos(rx), sxr = Math.sin(rx);
  const dotBase = Math.max(0.8, R / 170);

  for (const [x, y, z] of pts) {
    const d = 0.12 * Math.sin(2.6 * x + t * 0.9) * Math.cos(2.1 * y - t * 0.7)
      + 0.10 * Math.sin(3.2 * z + t * 1.1 + y * 2)
      + L * (0.16 * Math.sin(5 * y + t * 6) * Math.cos(4 * x - t * 4) + 0.10 * Math.sin(7 * z + t * 9));
    const s = 1 + d, X = x * s, Y = y * s, Z = z * s;
    const x1 = X * cyr + Z * syr, z1 = -X * syr + Z * cyr;
    const y2 = Y * cxr - z1 * sxr, z2 = Y * sxr + z1 * cxr;
    const persp = 2.6 / (2.6 - z2), px = cx + x1 * R * persp, py = cy + y2 * R * persp;
    const depth = (z2 + 1.3) / 2.6, k = Math.min(1, Math.max(0, (y * 0.5 + 0.5) * 1.2 - 0.1));
    const r = c1[0] + (c2[0] - c1[0]) * k, g = c1[1] + (c2[1] - c1[1]) * k, b = c1[2] + (c2[2] - c1[2]) * k;
    ctx.fillStyle = `rgba(${r | 0},${g | 0},${b | 0},${0.15 + depth * 0.85})`;
    const sz = dotBase * (0.5 + depth * 0.9) * (1 + L * 0.15);
    ctx.beginPath(); ctx.arc(px, py, sz, 0, 6.283); ctx.fill();
  }

  // HUD rings: spin steadily, brighten and swell with the voice.
  const glow = 0.22 + L * 0.7;
  ctx.save(); ctx.translate(cx, cy);
  const rings = [[1.2, 1.6, [R * .34, R * .1], t * .32], [1.3, 1, [2, 6], -t * .16], [1.4, 2.6, [R * .05, R * .26], t * .62]];
  for (const [k, w2, dash, rot] of rings) {
    ctx.strokeStyle = `rgba(120,190,255,${glow * .7})`; ctx.lineWidth = w2; ctx.setLineDash(dash);
    ctx.beginPath(); ctx.arc(0, 0, R * k * (1 + L * .035), rot, rot + Math.PI * 2); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (let i = 0; i < 60; i++) {
    const a = (i / 60) * Math.PI * 2 - t * .05, long = i % 5 === 0;
    ctx.strokeStyle = `rgba(90,150,220,${(long ? .5 : .2) * (0.5 + glow)})`; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * R * 1.47, Math.sin(a) * R * 1.47);
    ctx.lineTo(Math.cos(a) * R * (long ? 1.54 : 1.5), Math.sin(a) * R * (long ? 1.54 : 1.5)); ctx.stroke();
  }
  ctx.restore();
}

// ---- Speech ----------------------------------------------------------------
// Live: Piper WAVs from JARVIS, fetched ahead (the next line renders while
// this one plays) and played through an analyser for the orb.
const clips = new Map();
function piperClip(text) {
  if (!clips.has(text)) {
    clips.set(text, fetch('/tts', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ text }) })
      .then(res => { if (!res.ok) throw new Error(`tts ${res.status}`); return res.arrayBuffer(); })
      .then(buf => ensureAudio().decodeAudioData(buf))
      .catch(err => { clips.delete(text); throw err; }));
  }
  return clips.get(text);
}

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}

function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  return voices.find(v => /en-GB/i.test(v.lang) && /male|daniel|george|arthur/i.test(v.name))
    || voices.find(v => /en-GB/i.test(v.lang));
}

function stopSpeech() {
  runId++;
  clearTimeout(timer);
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (currentSource) { try { currentSource.onended = null; currentSource.stop(); } catch {} currentSource = null; }
  if (speaking) { speaking = false; reportStatus(); }
}

function say(text, next) {
  const id = ++runId;
  set({ caption:text });
  speaking = true;
  reportStatus();
  const done = () => {
    if (id !== runId) return;
    speaking = false;
    currentSource = null;
    reportStatus();
    timer = setTimeout(() => { if (id === runId) next(); }, 450);
  };
  const silent = () => { timer = setTimeout(done, Math.max(2600, text.length * 62)); };

  if (!state.voice) return silent();
  if (LIVE) {
    piperClip(text).then(buffer => {
      if (id !== runId) return;
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(analyser);
      src.onended = done;
      currentSource = src;
      src.start();
    }).catch(() => { if (id === runId) silent(); });
    return;
  }
  if (!window.speechSynthesis) return silent();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.02; u.pitch = 0.9;
  const v = pickVoice(); if (v) u.voice = v;
  let fired = false;
  const once = () => { if (!fired) { fired = true; clearTimeout(timer); done(); } };
  u.onend = once; u.onerror = once;
  timer = setTimeout(once, text.length * 95 + 2500); // fallback if onend never fires
  speechSynthesis.speak(u);
}

// ---- Briefing flow ---------------------------------------------------------
function run(step) {
  if (state.phase !== 'briefing') return;
  set({ step });
  if (step === -1) return say(report.intro, () => run(0));
  if (step < CATS.length) { set({ revealed:step + 1 }); return say(CATS[step].say, () => run(step + 1)); }
  say(report.outro, () => finish());
}

function finish() {
  set({ phase:'done', step:CATS.length });
  if (opts.embedded) {
    clearTimeout(autoCloseTimer);
    autoCloseTimer = setTimeout(closeWindow, AUTO_CLOSE_MS);
  }
}

function start() {
  if (!report) return;
  stopSpeech();
  clearTimeout(autoCloseTimer);
  if (LIVE && state.voice) {
    ensureAudio();
    [report.intro, ...CATS.map(c => c.say), report.outro].forEach(t => piperClip(t).catch(() => {}));
  }
  talkSpeaking = false;
  set({ phase:'briefing', revealed:0, label:null });
  run(-1);
}

// "hey Jarvis" mid-briefing: stop talking, lay out every finding to read.
function stopBriefing() {
  if (state.phase !== 'briefing') return;
  stopSpeech();
  set({ caption:'Go ahead, I\'m listening.', revealed:CATS.length });
  finish();
}

function close() { stopSpeech(); clearTimeout(autoCloseTimer); set({ phase:'idle', step:-2, revealed:0, caption:IDLE_CAPTION }); }
function closeWindow() { close(); set({ phase:'closed' }); setTimeout(() => window.close(), 150); }

function replayCat(i) {
  if (state.phase === 'briefing') return;
  stopSpeech();
  clearTimeout(autoCloseTimer);
  set({ step:i, label:null });
  say(CATS[i].say, () => {});
}

$('btn-primary').addEventListener('click', () => (opts.mirror ? command('start') : start()));
$('btn-close').addEventListener('click', () => (opts.mirror ? command('dismiss') : opts.embedded ? closeWindow() : close()));
$('btn-voice').addEventListener('click', () => (opts.mirror ? command('voice') : toggleVoice()));
function toggleVoice() {
  if (state.voice) stopSpeechOnly();
  set({ voice:!state.voice });
}
function stopSpeechOnly() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (currentSource) { try { currentSource.stop(); } catch {} } // onended moves the briefing on
}
// ---- Kill switch / minimize (the pet owns the windows) ---------------------
const bridge = window.jarvisScreen;
if (opts.embedded) document.body.classList.add('embedded');
function setMode(mode) {
  document.body.classList.toggle('mini', mode === 'mini');
  if (bridge) bridge.setMode(mode);
}
function killScreen() {
  if (bridge) { closeWindow(); setTimeout(() => bridge.close(), 200); } else closeWindow();
}
if (bridge) bridge.onMode(mode => document.body.classList.toggle('mini', mode === 'mini'));
document.querySelectorAll('.winbtns .minimize').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); setMode('mini'); }));
document.querySelectorAll('.winbtns .restore').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); setMode('full'); }));
document.querySelectorAll('.winbtns .kill').forEach(b => b.addEventListener('click', e => {
  e.stopPropagation();
  opts.mirror ? command('dismiss') : killScreen();
}));
$('screen').addEventListener('click', () => { if (document.body.classList.contains('mini')) setMode('full'); });

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !opts.embedded) return;
  opts.mirror ? command('dismiss') : closeWindow();
});
window.addEventListener('beforeunload', () => {
  if (LIVE && !opts.mirror && opts.embedded && state.phase !== 'closed') navigator.sendBeacon?.('/screen/status', new Blob([JSON.stringify({ phase:'closed' })], { type:'application/json' }));
});

// ---- Boot ------------------------------------------------------------------
if (window.speechSynthesis) speechSynthesis.getVoices(); // warm the voice list
buildCards();
render();
renderClock();
setInterval(renderClock, 1000);
(function loop(t) { draw(t / 1000); requestAnimationFrame(loop); })(0);
(async () => {
  if (LIVE) {
    reportStatus();
    if (!(await loadReport())) return;
    poll();
  }
  if (opts.autoStart && !opts.mirror) setTimeout(start, 800);
})();
</script>
</body>
</html>
