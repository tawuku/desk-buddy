<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with JARVIS</title>
<!--
  Type to JARVIS. Served by the JARVIS app (computer/voice/screen_server.py,
  GET /chat); the pet opens it with ⌘⇧J. Questions go to POST /ask and the
  answer streams back (server-sent events) -- same brain as the voice,
  minus the speech steps, so it's quicker.
-->
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #05080e; --panel: #0b1320; --line: rgba(110,170,240,.18); --ink: #e6f2ff; --dim: #7fa6cc; --faint: #4f7ea8;
    --blue: #7cc4ff; --me: rgba(60,130,230,.22); --green: #8fe3b0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 'Chakra Petch', -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; }
  .mono { font-family: 'JetBrains Mono', Menlo, monospace; }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px 78px; border-bottom: 1px solid var(--line);
    -webkit-app-region: drag; background: linear-gradient(180deg, #0a1322, var(--bg)); }
  #orb { width: 26px; height: 26px; }
  header .name { font-size: 13px; letter-spacing: .32em; color: var(--ink); }
  header .state { font-size: 10px; letter-spacing: .2em; color: var(--faint); }
  header .grow { flex: 1; }
  header button { -webkit-app-region: no-drag; background: transparent; border: 1px solid var(--line); color: var(--dim);
    font: 11px 'JetBrains Mono', monospace; letter-spacing: .12em; padding: 5px 9px; border-radius: 6px; cursor: pointer; }
  header button.on { color: var(--ink); border-color: rgba(140,200,255,.6); background: rgba(80,160,255,.12); }

  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; scrollbar-width: thin; }
  .msg { max-width: 86%; padding: 10px 13px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; animation: in .18s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .me { align-self: flex-end; background: var(--me); border: 1px solid rgba(120,180,255,.3); border-bottom-right-radius: 4px; }
  .jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .jarvis.streaming::after { content: '▍'; color: var(--blue); animation: blink .7s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .meta { font-size: 10px; letter-spacing: .12em; color: var(--faint); margin-top: 5px; }
  .status { align-self: flex-start; font-size: 11px; letter-spacing: .12em; color: var(--dim); padding-left: 4px; }
  .status::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .error { border-color: rgba(255,138,138,.5); color: #ffc9c9; }

  #empty { margin: auto 0; text-align: center; color: var(--dim); }
  #empty h2 { font-weight: 500; font-size: 18px; color: var(--ink); margin: 0 0 4px; }
  #empty p { margin: 0 0 16px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips button { background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 16px; padding: 7px 12px;
    font: 13px 'Chakra Petch', sans-serif; cursor: pointer; }
  .chips button:hover { border-color: rgba(140,200,255,.6); }

  footer { padding: 10px 12px 14px; border-top: 1px solid var(--line); }
  .box { display: flex; gap: 8px; align-items: flex-end; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 8px 12px; }
  .box:focus-within { border-color: rgba(140,200,255,.6); box-shadow: 0 0 0 3px rgba(80,160,255,.12); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: 15px/1.4 'Chakra Petch', sans-serif;
    max-height: 140px; min-height: 22px; padding: 3px 0; }
  textarea::placeholder { color: var(--faint); }
  #send { width: 34px; height: 34px; border-radius: 10px; border: 0; background: #3761e6; color: #fff; font-size: 16px; cursor: pointer; flex: none; }
  #send:disabled { opacity: .35; cursor: default; }
  .hint { margin-top: 6px; font-size: 10px; letter-spacing: .1em; color: var(--faint); text-align: center; }
</style>
</head>
<body>
<header>
  <canvas id="orb" width="52" height="52"></canvas>
  <div><div class="name mono">J.A.R.V.I.S</div><div class="state mono" id="state">READY</div></div>
  <div class="grow"></div>
  <button id="speak" title="Also say answers out loud">🔊 SPEAK</button>
  <button id="clear" title="Clear the chat">CLEAR</button>
</header>
<div id="log">
  <div id="empty">
    <h2>Type to JARVIS</h2>
    <p>Same brain as the voice -- just quicker.</p>
    <div class="chips" id="chips"></div>
  </div>
</div>
<footer>
  <div class="box">
    <textarea id="input" rows="1" placeholder="Ask anything…  (Enter to send)" autofocus></textarea>
    <button id="send" title="Send">↑</button>
  </div>
  <div class="hint mono">⌘⇧J OPENS THIS ANYWHERE · ESC HIDES · ↑ LAST MESSAGE</div>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const SUGGESTIONS = ["Give me an update", "What's the weather?", "Remind me in 10 minutes to stretch", "How are my sites doing?",
  "What's on my screen?", "Play some music", "How did I sleep?", "Remember that…"];
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let history = store.get('jarvis-chat', []);
let speak = store.get('jarvis-chat-speak', false);
let busy = false, lastAsked = store.get('jarvis-chat-last', '');

// --- tiny orb that breathes, and pulses while JARVIS answers ----------------
const oc = $('orb').getContext('2d');
(function orb(t) {
  const k = busy ? 0.5 + 0.5 * Math.abs(Math.sin(t / 140)) : 0.2 + 0.1 * Math.sin(t / 900);
  oc.clearRect(0, 0, 52, 52);
  const g = oc.createRadialGradient(26, 26, 2, 26, 26, 24);
  g.addColorStop(0, `rgba(160,215,255,${0.9})`); g.addColorStop(0.45, `rgba(90,150,255,${0.35 + k * 0.4})`); g.addColorStop(1, 'rgba(120,90,255,0)');
  oc.fillStyle = g; oc.beginPath(); oc.arc(26, 26, 14 + k * 9, 0, Math.PI * 2); oc.fill();
  requestAnimationFrame(orb);
})(0);

// --- rendering ---------------------------------------------------------------
function bubble(role, text, meta) {
  $('empty').style.display = 'none';
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta mono'; m.textContent = meta; el.appendChild(m); }
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return el;
}
function render() {
  document.querySelectorAll('.msg,.status').forEach((e) => e.remove());
  $('empty').style.display = history.length ? 'none' : '';
  for (const m of history) bubble(m.role, m.text, m.meta);
}
function metaFor(ev) {
  const src = { quick: 'instant', smart: 'instant', mac: 'done on your Mac', screen: 'screen', briefing: 'on screen', model: 'local model', error: 'error' }[ev.source] || ev.source || '';
  return `${ev.seconds < 1 ? `${Math.round(ev.seconds * 1000)} ms` : `${ev.seconds} s`}${src ? ' · ' + src.toUpperCase() : ''}`;
}
$('chips').innerHTML = '';
for (const s of SUGGESTIONS) {
  const b = document.createElement('button');
  b.textContent = s;
  b.onclick = () => { if (s.endsWith('…')) { $('input').value = s.replace('…', ' '); $('input').focus(); } else ask(s); };
  $('chips').appendChild(b);
}

// --- asking ------------------------------------------------------------------
async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true; $('state').textContent = 'THINKING';
  lastAsked = text; store.set('jarvis-chat-last', text);
  history.push({ role: 'me', text }); bubble('me', text);
  const status = document.createElement('div'); status.className = 'status mono'; status.textContent = 'On it';
  $('log').appendChild(status); $('log').scrollTop = $('log').scrollHeight;
  let answer = null, final = null;
  try {
    const res = await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text, speak }) });
    if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!line.startsWith('data: ')) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === 'status') status.textContent = ev.text.replace(/[….]+$/, '');
        else if (ev.type === 'token') {
          if (!answer) { status.remove(); answer = bubble('jarvis', ''); answer.classList.add('streaming'); }
          answer.textContent += ev.text; $('log').scrollTop = $('log').scrollHeight;
        } else if (ev.type === 'done') final = ev;
      }
    }
  } catch (err) {
    final = { text: "I can't reach JARVIS right now -- is it switched on in PA?", source: 'error', seconds: 0, failed: true };
  }
  status.remove();
  if (answer) answer.remove();
  if (final) {
    const meta = metaFor(final);
    const el = bubble('jarvis', final.text || '(no answer)', meta);
    if (final.failed) el.classList.add('error');
    history.push({ role: 'jarvis', text: final.text || '', meta });
    history = history.slice(-60); store.set('jarvis-chat', history);
  }
  busy = false; $('send').disabled = false; $('state').textContent = 'READY'; $('input').focus();
}

// --- input -------------------------------------------------------------------
const input = $('input');
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(140, input.scrollHeight) + 'px'; }
input.addEventListener('input', autosize);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); const t = input.value; input.value = ''; autosize(); ask(t); }
  else if (e.key === 'ArrowUp' && !input.value && lastAsked) { e.preventDefault(); input.value = lastAsked; autosize(); }
});
$('send').onclick = () => { const t = input.value; input.value = ''; autosize(); ask(t); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && window.jarvisChat) window.jarvisChat.hide(); });
$('speak').classList.toggle('on', speak);
$('speak').onclick = () => { speak = !speak; store.set('jarvis-chat-speak', speak); $('speak').classList.toggle('on', speak); };
$('clear').onclick = () => { history = []; store.set('jarvis-chat', history); render(); };
if (window.jarvisChat) window.jarvisChat.onShow(() => { input.focus(); input.select(); });
render();
</script>
</body>
</html>
